[package]
name = "canonical-api-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Canonical Cloud readiness REST, WebSocket, and webhook API"
license = "MIT"
repository = "https://github.com/canonical-cloud/canonical-api-server.rs"
default-run = "canonical-api-server"

[[bin]]
name = "canonical-api-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-server = "0.8.0"
canonical-lib = { git = "https://github.com/canonical-cloud/canonical-lib-core", rev = "c636c08c7ed16255711752c55ed1ae3d7c2db434" }
canonical-orm-core = { git = "https://github.com/canonical-cloud/canonical-orm-core", rev = "cadf545a18c807f663574a0b2eb93355f8561c32", features = ["read-write"] }
canonical-interfaces = { git = "https://github.com/canonical-cloud/canonical-interfaces", rev = "0cab33c2b2a494d2368ef1da0ebe5d614b3a96ef" }
futures-util = "0.3.32"
hmac = "0.12.1"
next-loggers = { git = "https://github.com/ores-otel/ores.otel.log", rev = "ca176fb6768a9750d262a536952268625ffd3a8a", package = "oresoftware-next-loggers" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "0.10.9"
shared-auth-client = { git = "https://github.com/shared-auth/shared-auth-clients", rev = "cc57a85b276bee81ad94decc87df2f48d49cab9f", package = "shared-auth-client" }
subtle = "2.6.1"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
