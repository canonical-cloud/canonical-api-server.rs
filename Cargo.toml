[package]
name = "canonical-api-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Canonical Cloud quote REST and WebSocket API"
license = "MIT"
repository = "https://github.com/canonical-cloud/canonical-api-server.rs"
default-run = "canonical-api-server"

[[bin]]
name = "canonical-api-server"
path = "src/main.rs"

[dependencies]
canonical-interfaces = { git = "https://github.com/canonical-cloud/canonical-interfaces", rev = "3415d6d97721b18ee6734659d73a95ff3d35a151", package = "canonical-interfaces" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
axum = { version = "0.8.9", features = ["macros", "ws"] }
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "2.0.0", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
