[package]
name = "canonical-api-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.23.0"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.32"
hmac = "0.12.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "2.0.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7.0", features = ["request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
