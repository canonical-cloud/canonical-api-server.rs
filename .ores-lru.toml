# Contract authority: ores-redis-lru-cache/ores-lru-redis-interfaces@4474d240b38a4fe1dd24f01dcd2e9ab7a4c34b27
# Runtime loader: ores-redis-lru-cache/ores-lru-redis.rs@d0afdae952a1efcfc3feaa9bdc145e3636457832
protocol = "ores.lru-config.v1"
namespace = "canonical-api-server"
roles = ["server"]

[redis]
urlEnv = "REDIS_URL"
keyPrefix = "ores:lru:v1:canonical-api-server"
pubsubChannel = "ores:lru:v1:canonical-api-server:events"
reconcileIntervalMs = 180000
reconnectMinMs = 1000
reconnectMaxMs = 30000

[defaults]
capacity = 1024
syncMode = "read_only"
overflowMode = "reject_and_reconcile"
failOpenOnStartup = false

[[caches]]
name = "runtime-env"
role = "server"
