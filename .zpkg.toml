[package]
org = "canonical-cloud"
name = "canonical-api-server"
version = "0.1.0"
description = "Canonical readiness REST, WebSocket, and webhook API"
license = "MIT"
keywords = ["api", "rust", "axum", "seaorm", "readiness", "webhook"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/canonical-cloud/canonical-api-server.rs"

[dependencies]
"canonical-cloud/canonical-orm-core" = "^0.1.0"
"canonical-cloud/canonical-interfaces" = "^0.1.0"
"canonical-cloud/canonical-lib-core" = "^0.1.0"
"oresoftware/next-loggers" = "=0.1.0"
"shared-auth/shared-auth-clients" = "=0.1.0"

[build]
command = "cargo build --release --bin canonical-api-server"
outputs = ["target/release/canonical-api-server"]

[bin]
canonical-api-server = "target/release/canonical-api-server"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
adapter = "none"
dir = ".vendor/.zed"

[scripts]
test = "cargo fmt --all -- --check && cargo test --all-targets --all-features --locked && cargo clippy --all-targets --all-features --locked -- -D warnings"