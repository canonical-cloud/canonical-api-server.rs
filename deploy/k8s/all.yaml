apiVersion: v1
kind: Namespace
metadata:
  name: canonical
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canonical-api-server
  namespace: canonical
  labels:
    app.kubernetes.io/name: canonical-api-server
    app.kubernetes.io/part-of: canonical-quote-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: canonical-api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canonical-api-server
        app.kubernetes.io/part-of: canonical-quote-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/canonical-cloud/canonical-api-server.rs@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8081
            - name: GEMINI_MODEL
              value: gemini-3.1-pro-preview
            - name: QUOTE_CONTEXT_MARKDOWN_PATH
              value: context/quote-analysis.md
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: canonical-quote-api-runtime
                  key: DATABASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: canonical-quote-api-runtime
                  key: GEMINI_API_KEY
            - name: ORIGIN_ASSERTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: canonical-quote-api-runtime
                  key: ORIGIN_ASSERTION_SECRET
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: canonical-api-server
  namespace: canonical
  labels:
    app.kubernetes.io/name: canonical-api-server
spec:
  selector:
    app.kubernetes.io/name: canonical-api-server
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: canonical-api-server
  namespace: canonical
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: canonical-api-server
