name: generate lockfile once

on:
  pull_request:
    paths:
      - .github/workflows/generate-lockfile-once.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN_VALUE: ${{ github.token }}
    steps:
      - name: Check out exact reviewed branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Generate and commit only Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = canonical-cloud/canonical-api-server.rs
          test "$HEAD_REF" = chore/add-container-packaging
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test ! -e Cargo.lock

          cargo generate-lockfile
          test -s Cargo.lock
          content="$(base64 -w0 Cargo.lock)"
          payload="$(jq -nc \
            --arg message 'build: commit deterministic Cargo lockfile' \
            --arg content "$content" \
            --arg branch "$HEAD_REF" \
            '{message:$message,content:$content,branch:$branch}')"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/Cargo.lock" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN_VALUE}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" >/dev/null
          echo 'VERIFIED committed only Cargo.lock to the reviewed feature branch'
