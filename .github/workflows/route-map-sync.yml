name: route-map-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require private Canonical route-map read credential
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CANONICAL_LIB_READ_TOKEN" ]; then
            echo "CANONICAL_LIB_READ_TOKEN must grant read-only access to canonical-lib-core" >&2
            exit 1
          fi

      - name: Check out exact private route-map authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-lib-core
          ref: d2f7371f01f257fbaee532b923f4c4b0d2c4dff4
          path: .ci/canonical-lib-core
          token: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
          persist-credentials: false

      - name: Expose the checker-compatible sibling path
        shell: bash
        run: |
          set -euo pipefail
          sibling="$GITHUB_WORKSPACE/../canonical-lib-core"
          test ! -e "$sibling"
          ln -s "$GITHUB_WORKSPACE/.ci/canonical-lib-core" "$sibling"
          test -f "$sibling/route-maps/api.route-map.json"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.0.0
        with:
          python-version: '3.11'

      # No pip install: the checker and generator are standard library only, so
      # CI and a developer laptop cannot reach different verdicts.
      - name: Validate the route maps and the generated clients
        run: python3 scripts/check-route-sync.py --root .
