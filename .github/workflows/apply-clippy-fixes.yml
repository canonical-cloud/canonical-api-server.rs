name: apply Clippy fixes

on:
  push:
    branches:
      - agent/quote-persistence-gemini

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/quote-persistence-gemini

      - name: Apply compiler-guided source corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/lib.rs'): [
                  ('    let mut record = QuoteRecord {\n', '    let record = QuoteRecord {\n'),
              ],
              Path('src/gemini.rs'): [
                  ('    pub async fn analyze(\n', '    pub(crate) async fn analyze(\n'),
              ],
          }
          for path, edits in replacements.items():
              source = path.read_text()
              for old, new in edits:
                  if source.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}')
                  source = source.replace(old, new)
              path.write_text(source)
          PY

      - name: Commit source-only fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canonical-implementation-bot'
          git config user.email 'canonical-implementation-bot@users.noreply.github.com'
          git add src/lib.rs src/gemini.rs
          git commit -m 'fix: satisfy strict Rust lint boundaries'
          git push origin HEAD:agent/quote-persistence-gemini
