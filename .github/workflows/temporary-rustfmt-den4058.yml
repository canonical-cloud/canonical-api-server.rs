name: Format DEN-4058 API branch once
# dd:execution-carrier owner=DEN-4058 expires=2026-09-03

on:
  push:
    branches: [DEN-4058/pre-interest-api-foundation]
    paths:
      - src/pre_interest.rs
      - tests/pre_interest_foundation.rs
      - .github/workflows/temporary-rustfmt-den4058.yml

permissions:
  contents: write

concurrency:
  group: den-4058-api-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-retire:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-4058/pre-interest-api-foundation
          fetch-depth: 2
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Format the exact Rust source
        run: cargo fmt --all
      - name: Retire the carrier and push only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/temporary-rustfmt-den4058.yml').unlink()
          PY
          git add -A
          git diff --cached --quiet && { echo 'no formatting changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-4058): apply rustfmt to pre-interest foundation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
