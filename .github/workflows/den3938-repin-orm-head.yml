name: DEN-3938 temporary exact ORM repin

on:
  push:
    branches:
      - DEN-3938/opaque-persistence-boundaries
    paths:
      - ".github/workflows/den3938-repin-orm-head.yml"

permissions:
  contents: write

jobs:
  repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3938/opaque-persistence-boundaries
          persist-credentials: true
          fetch-depth: 1
      - name: Repin reviewed orm-core head exactly
        shell: bash
        run: |
          set -euo pipefail
          old='5547c4c2f5c177be83788b3976505a5c942a991b'
          new='ad04984b227b0f2bcca1d8dc6ee858bd58a46f94'
          python3 - <<'PY'
          from pathlib import Path
          old='5547c4c2f5c177be83788b3976505a5c942a991b'
          new='ad04984b227b0f2bcca1d8dc6ee858bd58a46f94'
          for name in ('Cargo.toml','Cargo.lock'):
              p=Path(name)
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected exactly one old ORM SHA, found {n}')
              p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "Cargo.lock Cargo.toml "
          grep -F "$new" Cargo.toml
          grep -F "$new" Cargo.lock
          ! grep -F "$old" Cargo.toml
          ! grep -F "$old" Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m 'DEN-3938: repin orm-core generic catalog invariants'
          git push origin HEAD:DEN-3938/opaque-persistence-boundaries
