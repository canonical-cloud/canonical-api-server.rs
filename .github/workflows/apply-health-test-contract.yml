name: apply health test contract

on:
  push:
    branches:
      - agent/quote-persistence-gemini

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/quote-persistence-gemini

      - name: Align the unit test with camelCase health JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib.rs')
          source = path.read_text()
          edits = {
              'body["database_configured"]': 'body["databaseConfigured"]',
              'body["gemini_configured"]': 'body["geminiConfigured"]',
              'body["gemini_model"]': 'body["geminiModel"]',
          }
          for old, new in edits.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old}')
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Format and commit the test-only correction
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name 'canonical-implementation-bot'
          git config user.email 'canonical-implementation-bot@users.noreply.github.com'
          git add src/lib.rs
          git commit -m 'test: assert camelCase health response fields'
          git push origin HEAD:agent/quote-persistence-gemini
