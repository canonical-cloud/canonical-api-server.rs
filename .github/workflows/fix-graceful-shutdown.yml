name: Fix and validate graceful-shutdown branch

on:
  push:
    branches:
      - agent/graceful-shutdown
    paths:
      - src/shutdown.rs
      - .github/workflows/fix-graceful-shutdown.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-graceful-shutdown-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Remove unreachable reducer transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/shutdown.rs')
          text = path.read_text()
          text = text.replace('    Drained,\n', '')
          block = '''            if matches!(event, Event::Drained) {
                let mut next = state;
                next.phase = Phase::Stopped;
                return (next, Action::Complete);
            }

'''
          text = text.replace(block, '')
          text = text.replace('    Complete,\n', '')
          text = text.replace('''                    Action::Complete => {
                        handle.shutdown();
                    }
''', '')
          path.write_text(text)
          PY

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Commit only the shutdown source correction
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Shutdown reducer is already current.'
            exit 0
          fi
          if [[ "$changed" != 'src/shutdown.rs' ]]; then
            echo 'Refusing to commit unexpected files:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shutdown.rs
          git commit -m 'fix: remove unreachable shutdown transition'
          git push origin "HEAD:${GITHUB_REF_NAME}"
