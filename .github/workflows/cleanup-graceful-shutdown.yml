name: Clean graceful-shutdown migration scaffolding

on:
  push:
    branches:
      - agent/graceful-shutdown
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cleanup-graceful-shutdown.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-graceful-shutdown-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Revalidate product source before cleanup
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Remove branch-only migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/fix-graceful-shutdown.yml \
            .github/workflows/apply-lifecycle-migration.yml \
            .github/workflows/cleanup-graceful-shutdown.yml \
            .github/graceful-shutdown/migration-v2.tgz.b64
          rmdir .github/graceful-shutdown 2>/dev/null || true

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No migration scaffolding remains.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove graceful-shutdown migration scaffolding'
          git push origin "HEAD:${GITHUB_REF_NAME}"
