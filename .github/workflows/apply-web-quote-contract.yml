name: apply web quote contract

on:
  push:
    branches:
      - agent/web-quote-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/web-quote-contract

      - name: Apply owner-scoped browser API contract
        run: python3 .bootstrap/apply_web_quote_contract.py

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Format and verify the implementation
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 test --all-targets --all-features --locked
          cargo +1.95.0 clippy --all-targets --all-features --locked -- -D warnings

      - name: Commit source-only implementation
        run: |
          set -euo pipefail
          git config user.name 'canonical-implementation-bot'
          git config user.email 'canonical-implementation-bot@users.noreply.github.com'
          git add src/lib.rs src/persistence.rs README.md
          git commit -m 'feat: expose owner-scoped web quote contract'
          git push origin HEAD:agent/web-quote-contract
