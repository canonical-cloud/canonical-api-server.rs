name: Recovery format and lock

on:
  push:
    branches:
      - agent/graceful-shutdown
    paths:
      - .github/workflows/recovery-format-lock.yml

permissions:
  contents: write

concurrency:
  group: canonical-api-server-recovery-format-lock
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'canonical-cloud/canonical-api-server.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/graceful-shutdown
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Format, resolve the lockfile, validate, and preserve generated changes
        shell: bash
        run: |
          set -uo pipefail
          cargo fmt --all

          check_status=0
          cargo check --all-targets --all-features || check_status=$?
          git diff --check

          if ! git diff --quiet -- Cargo.lock Cargo.toml src; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock Cargo.toml src
            git commit -m 'chore: format shutdown code and refresh lockfile'
            git push origin HEAD:agent/graceful-shutdown
          fi

          exit "$check_status"
