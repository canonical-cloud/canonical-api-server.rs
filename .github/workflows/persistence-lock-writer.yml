name: persistence-lock-writer

on:
  push:
    branches:
      - DEN-3938/opaque-persistence-boundaries
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/derive-persistence-lock.rs"
      - ".github/workflows/persistence-lock-writer.yml"

permissions:
  contents: write

jobs:
  write:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: DEN-3938/opaque-persistence-boundaries
          persist-credentials: true
          fetch-depth: 1

      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Derive and commit exact mechanical lock
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.95.0 --edition 2021 tools/derive-persistence-lock.rs -o /tmp/derive-persistence-lock
          /tmp/derive-persistence-lock Cargo.toml Cargo.lock /tmp/Cargo.lock.mechanical
          cp /tmp/Cargo.lock.mechanical Cargo.lock
          test "$(git diff --name-only | tr -d '\r')" = "Cargo.lock"
          git diff --check
          git diff -- Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: commit mechanical persistence lock'
          git push origin HEAD:DEN-3938/opaque-persistence-boundaries
