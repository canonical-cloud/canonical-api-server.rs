name: publish image

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "src/**"
      - "context/**"
      - "db/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: canonical-api-image-main
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/canonical-cloud/canonical-api-server.rs:main
            ghcr.io/canonical-cloud/canonical-api-server.rs:${{ github.sha }}
          # Passed as a BuildKit secret for the private canonical-lib-core
          # checkout; Dockerfile never persists it into the image.
          secrets: |
            github_token=${{ github.token }}
          provenance: mode=max
          sbom: true

      - name: Record published digest
        shell: bash
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt

      - name: Publish digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-api-image-digest-${{ github.sha }}
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 30
