name: resolve and verify Canonical Zed lock

on:
  push:
    branches: [feat/ores-rate-limit-audit-v2]
    paths:
      - ".github/workflows/resolve-zed-lock.yml"
      - ".zpkg.toml"

permissions:
  contents: write

concurrency:
  group: canonical-api-zed-lock-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REVISION: 5c65985274dd42b5974db51c73adc256cb28bbdb
  ZED_PKG_REGISTRY: https://registry.zpkg.net

jobs:
  resolve-verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ores-rate-limit-audit-v2
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install registry-fallback-certified Zed
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --git https://github.com/zed-pkg/zed-cli \
            --rev "$ZED_CLI_REVISION" \
            --locked zed-cli
      - name: Resolve and materialize reviewed package coordinates
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .zpkg.lock
          zed install --install-mode copy
          zed validate --require-lock
          test -f .vendor/.zed/canonical-cloud/canonical-lib/Cargo.toml
          test -f .vendor/.zed/shared-auth/shared-auth-clients/clients/rust/Cargo.toml
          test -f .vendor/.zed/oresoftware/next-loggers/Cargo.toml
          if grep -v '^source = "https://registry.zpkg.net"$' <(grep '^source = ' .zpkg.lock); then
            echo 'lock contains a noncanonical registry source' >&2
            exit 1
          fi
          if find .vendor/.zed -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo 'materialized package contains a forbidden environment file' >&2
            exit 1
          fi
          find .vendor/.zed -type f -name Cargo.toml -print | sort
      - name: Commit only the immutable lock and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/resolve-zed-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .zpkg.lock
          git rm "$workflow"
          git diff --cached --check
          if git diff --cached | grep -Eq 'ghp_|lin_api_|github_pat_'; then
            echo 'credential-shaped material entered the staged diff' >&2
            exit 1
          fi
          git commit -m 'build: lock Canonical dependencies through zed-pkg'
          git push origin "HEAD:${GITHUB_REF_NAME}"
