name: Restore Gemini 3.6 Pro default on repair branch

on:
  push:
    branches:
      - agent/restore-gemini-3-6-default

permissions:
  contents: write

concurrency:
  group: restore-gemini-3-6-default
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/restore-gemini-3-6-default
          persist-credentials: true

      - name: Restore the reviewed model contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          old = 'gemini-3.1-pro-preview'
          new = 'gemini-3.6-pro'
          paths = subprocess.check_output(
              ['git', 'grep', '-l', '--', old],
              text=True,
          ).splitlines()
          if len(paths) < 3:
              raise SystemExit(f'expected model drift in at least three tracked files, found {paths}')
          for raw_path in paths:
              path = Path(raw_path)
              text = path.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'expected {old} in {path}')
              path.write_text(text.replace(old, new))
              print(f'updated {path}: {count} occurrence(s)')

          Path('.github/workflows/restore-gemini-3-6-branch-fix.yml').unlink()
          PY
          git diff --check
          ! git grep -n -- 'gemini-3.1-pro-preview'
          git grep -n -- 'gemini-3.6-pro'

      - name: Commit the clean model-default repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore Gemini 3.6 Pro default'
          git push origin HEAD:agent/restore-gemini-3-6-default
