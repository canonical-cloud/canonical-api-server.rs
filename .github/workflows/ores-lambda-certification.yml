name: ORES Lambda real-org certification

on:
  pull_request:
    paths:
      - "src/routes/**"
      - "src/lib.rs"
      - "src/main.rs"
      - "src/ores_api_lambda.rs"
      - ".github/workflows/ores-lambda-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Require current API Lambda export boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d src/routes
          test ! -e src/rpc_routes
          test -f src/routes/user/handlers.rs
          test -f src/routes/user/route.rs
          test -f src/ores_api_lambda.rs
          grep -Fx 'pub mod ores_api_lambda;' src/lib.rs >/dev/null || {
            echo 'src/lib.rs must declare unconditional `pub mod ores_api_lambda;` for external provider wrappers' >&2
            exit 1
          }
          head -n 1 src/ores_api_lambda.rs | grep -Fx '// @generated by `ores-stack api lambda exports`; DO NOT EDIT.'

      - name: Require explicit cross-repository read credential
        shell: bash
        env:
          ORES_CROSS_REPO_READ_TOKEN: ${{ secrets.ORES_CROSS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ORES_CROSS_REPO_READ_TOKEN" || {
            echo "ORES_CROSS_REPO_READ_TOKEN is required to read private ORESoftware/ores-stack" >&2
            exit 1
          }

      - name: Check out exact merged ores-stack API Lambda baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-stack
          ref: 3156da4e5c707fde66d4f33e384d3f5c9e932dc2
          path: .cert/ores-stack
          token: ${{ secrets.ORES_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Build exact ores-stack CLI
        working-directory: .cert/ores-stack
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo build --locked -p ores-stack-cli

      - name: Generate the complete API source set from real Canonical sources
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/.cert/ores-stack/target/debug/ores-stack"
          test -x "$CLI"
          sha256sum src/routes/user/handlers.rs src/routes/user/route.rs > "$RUNNER_TEMP/authored-before.sha256"
          "$CLI" generate all --root="$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/generate.log"
          sha256sum src/routes/user/handlers.rs src/routes/user/route.rs > "$RUNNER_TEMP/authored-after.sha256"
          cmp "$RUNNER_TEMP/authored-before.sha256" "$RUNNER_TEMP/authored-after.sha256"

      - name: Prove one handlers authority owns one guarded dispatcher and one Lambda unit
        shell: bash
        run: |
          set -euo pipefail
          RPC=src/routes/user/rpc.rs
          LAMBDA=src/routes/user/lambda.rs
          EXPORTS=src/ores_api_lambda.rs
          test -f "$RPC"
          test -f "$LAMBDA"
          test -f "$EXPORTS"
          head -n 1 "$RPC" | grep -F '// @generated'
          head -n 1 "$LAMBDA" | grep -Fx '// @generated by `ores-stack api lambda sync`; DO NOT EDIT.'
          head -n 1 "$EXPORTS" | grep -Fx '// @generated by `ores-stack api lambda exports`; DO NOT EDIT.'
          for key in canonical_cloud.user.find_users canonical_cloud.user.find_user_by_id; do
            grep -F "$key" "$RPC"
            grep -F "$key" "$LAMBDA"
            grep -F "$key" "$EXPORTS"
          done
          grep -F '/v1/find-users' "$LAMBDA"
          grep -F '/v1/find-user-by-id' "$LAMBDA"
          test "$(grep -F -c 'method: \"POST\"' "$LAMBDA")" -eq 2
          test "$(grep -F -c 'match __ores_call.key.as_str()' "$RPC")" -eq 1
          ! grep -F 'match __ores_call.key.as_str()' "$LAMBDA"
          ! grep -F 'match __ores_call.key.as_str()' "$EXPORTS"
          grep -F 'macro_rules! dispatch' "$RPC"
          grep -F 'pub async fn init_state()' "$LAMBDA"
          grep -F 'pub async fn run(' "$LAMBDA"
          grep -F 'pub fn __ores_dispatch_' "$EXPORTS"
          grep -F '::rpc::dispatch!' "$EXPORTS"
          ! grep -F 'fn main()' "$LAMBDA"
          ! grep -F 'lambda_runtime' "$LAMBDA"
          ! grep -F 'AWS_LAMBDA_RUNTIME_API' "$LAMBDA"

      - name: Require byte-exact complete generated-source check
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/.cert/ores-stack/target/debug/ores-stack"
          "$CLI" generate all --root="$GITHUB_WORKSPACE" --check
          git diff --check

      - name: Retain generated certification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ores-lambda-certification"
          mkdir -p "$OUT"
          git diff --binary -- src/routes src/ores_api_lambda.rs generated > "$OUT/generated.patch" || true
          cp "$RUNNER_TEMP/generate.log" "$OUT/generate.log" 2>/dev/null || true
          if [ -f src/routes/user/rpc.rs ]; then cp src/routes/user/rpc.rs "$OUT/user.rpc.rs"; fi
          if [ -f src/routes/user/lambda.rs ]; then cp src/routes/user/lambda.rs "$OUT/user.lambda.rs"; fi
          if [ -f src/ores_api_lambda.rs ]; then cp src/ores_api_lambda.rs "$OUT/ores_api_lambda.rs"; fi
          git status --short > "$OUT/git-status.txt"

      - name: Upload exact generated evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-ores-lambda-certification
          path: ${{ runner.temp }}/ores-lambda-certification
          if-no-files-found: error
          retention-days: 7
