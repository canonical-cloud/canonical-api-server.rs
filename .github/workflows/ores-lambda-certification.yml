name: ORES Lambda real-org certification

on:
  pull_request:
    paths:
      - "src/routes/**"
      - "src/main.rs"
      - ".github/workflows/ores-lambda-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out exact ores-stack candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-stack
          ref: 2ccb16b0eac0b36a1c50e7c1edc6bc15cd3a810c
          path: .cert/ores-stack
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Build exact ores-stack CLI
        working-directory: .cert/ores-stack
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo build --locked -p ores-stack-cli

      - name: Generate API RPC and Lambda siblings from real Canonical sources
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/.cert/ores-stack/target/debug/ores-stack"
          test -x "$CLI"
          test -d src/routes
          test ! -e src/rpc_routes
          test -f src/routes/user/handlers.rs
          test -f src/routes/user/route.rs
          sha256sum src/routes/user/handlers.rs src/routes/user/route.rs > "$RUNNER_TEMP/authored-before.sha256"
          "$CLI" --root "$GITHUB_WORKSPACE" sync | tee "$RUNNER_TEMP/sync.log"
          sha256sum src/routes/user/handlers.rs src/routes/user/route.rs > "$RUNNER_TEMP/authored-after.sha256"
          cmp "$RUNNER_TEMP/authored-before.sha256" "$RUNNER_TEMP/authored-after.sha256"
          grep -F 'strict_routes=true' "$RUNNER_TEMP/sync.log"

      - name: Prove one handlers authority owns two operations through one dispatcher
        shell: bash
        run: |
          set -euo pipefail
          RPC=src/routes/user/rpc.rs
          LAMBDA=src/routes/user/lambda.rs
          test -f "$RPC"
          test -f "$LAMBDA"
          grep -F '// @generated' "$RPC"
          grep -F '// @generated by `ores-stack lambda sync`; DO NOT EDIT.' "$LAMBDA"

          grep -F 'canonical_cloud.user.find_users' "$RPC"
          grep -F 'canonical_cloud.user.find_user_by_id' "$RPC"
          grep -F 'canonical_cloud.user.find_users' "$LAMBDA"
          grep -F 'canonical_cloud.user.find_user_by_id' "$LAMBDA"

          grep -F '/v1/find-users' "$LAMBDA"
          grep -F '/v1/find-user-by-id' "$LAMBDA"
          test "$(grep -F -c 'method: \"POST\"' "$LAMBDA")" -eq 2

          test "$(grep -F -c 'match __ores_call.key.as_str()' "$RPC")" -eq 1
          ! grep -F 'match __ores_call.key.as_str()' "$LAMBDA"
          grep -F 'macro_rules! dispatch_in' "$RPC"
          grep -F 'pub async fn __ores_lambda_dispatch' "$RPC"
          grep -F 'pub async fn init_state()' "$LAMBDA"
          grep -F 'pub async fn run(' "$LAMBDA"
          ! grep -F 'fn main()' "$LAMBDA"

      - name: Require byte-exact generated-source check
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/.cert/ores-stack/target/debug/ores-stack"
          "$CLI" --root "$GITHUB_WORKSPACE" sync --check
          git diff --check

      - name: Retain generated certification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ores-lambda-certification"
          mkdir -p "$OUT"
          git diff --binary -- src/routes generated > "$OUT/generated.patch" || true
          cp "$RUNNER_TEMP/sync.log" "$OUT/sync.log" 2>/dev/null || true
          if [ -f src/routes/user/rpc.rs ]; then cp src/routes/user/rpc.rs "$OUT/user.rpc.rs"; fi
          if [ -f src/routes/user/lambda.rs ]; then cp src/routes/user/lambda.rs "$OUT/user.lambda.rs"; fi
          git status --short > "$OUT/git-status.txt"

      - name: Upload exact generated evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-ores-lambda-certification
          path: ${{ runner.temp }}/ores-lambda-certification
          if-no-files-found: error
          retention-days: 7
