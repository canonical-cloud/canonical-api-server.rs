name: RPC source materialization

on:
  push:
    branches:
      - DEN-4078-shared-operation-rpc
    paths:
      - Cargo.toml
      - Cargo.lock
      - "contracts/rpc/version/**"
      - "src/**"
      - ".github/workflows/rpc-materialize-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpc-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Regenerate Cargo.lock from Cargo.toml
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo generate-lockfile

      - name: Generate admitted Contract IR and parity receipt
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "128"

      - name: Verify consumer admission
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalCloud.Rpc.Version.VersionResponse","CanonicalCloud.Rpc.Version.VersionError","CanonicalCloud.Rpc.Version.UserLookupHeaders","CanonicalCloud.Rpc.Version.FindUsersResponse","CanonicalCloud.Rpc.Version.FindUserByIdRequest","CanonicalCloud.Rpc.Version.FindUserByIdResponse","CanonicalCloud.Rpc.Version.UserLookupError"]'

      - name: Verify source authorities stayed immutable
        shell: bash
        run: git diff --exit-code -- contracts/rpc/version/ src/

      - name: Upload exact-head reproducibility bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rpc-reproducibility-${{ github.sha }}
          path: |
            Cargo.lock
            .typespec-json-schema-validator/report.json
            .typespec-json-schema-validator/contract-ir.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
