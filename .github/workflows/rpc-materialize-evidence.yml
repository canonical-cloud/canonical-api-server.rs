name: RPC source materialization

on:
  push:
    branches:
      - DEN-4078-shared-operation-rpc
    paths:
      - Cargo.toml
      - Cargo.lock
      - "contracts/rpc/version/**"
      - "src/**"
      - ".github/workflows/rpc-materialize-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpc-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Regenerate Cargo.lock with scoped Canonical library read access
        shell: bash
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          if [[ -z "${CANONICAL_LIB_READ_TOKEN:-}" ]]; then
            echo "::error::CANONICAL_LIB_READ_TOKEN is required for the pinned private canonical-lib-core source" >&2
            exit 1
          fi
          credential_config="$RUNNER_TEMP/canonical-lib-read.gitconfig"
          cleanup() {
            rm -f "$credential_config"
          }
          trap cleanup EXIT
          umask 077
          cat >"$credential_config" <<EOF
          [url "https://x-access-token:${CANONICAL_LIB_READ_TOKEN}@github.com/"]
              insteadOf = https://github.com/
          EOF
          export GIT_CONFIG_GLOBAL="$credential_config"
          export GIT_CONFIG_NOSYSTEM=1
          cargo generate-lockfile

      - name: Generate admitted Contract IR and parity receipt
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "128"

      - name: Verify consumer admission
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalCloud.Rpc.Version.VersionResponse","CanonicalCloud.Rpc.Version.VersionError","CanonicalCloud.Rpc.Version.UserLookupHeaders","CanonicalCloud.Rpc.Version.FindUsersResponse","CanonicalCloud.Rpc.Version.FindUserByIdRequest","CanonicalCloud.Rpc.Version.FindUserByIdResponse","CanonicalCloud.Rpc.Version.UserLookupError"]'

      - name: Commit only reproducibility evidence
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock .typespec-json-schema-validator/report.json .typespec-json-schema-validator/contract-ir.json
          if git diff --cached --quiet; then
            echo "RPC source evidence already current"
            exit 0
          fi
          git config user.name "ores-stack-rpc-bot"
          git config user.email "ores-stack-rpc-bot@users.noreply.github.com"
          git commit -m "chore(rpc): materialize lock and contract evidence [skip ci]"
          git push origin HEAD:DEN-4078-shared-operation-rpc
