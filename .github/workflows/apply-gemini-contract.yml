name: apply Gemini contract correction

on:
  push:
    branches:
      - agent/quote-persistence-gemini

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/quote-persistence-gemini

      - name: Preserve Gemini 3 default sampling behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/gemini.rs')
          source = path.read_text()
          old = '                "temperature": 0.2,\n'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one Gemini temperature override')
          path.write_text(source.replace(old, ''))
          PY

      - name: Commit source-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canonical-implementation-bot'
          git config user.email 'canonical-implementation-bot@users.noreply.github.com'
          git add src/gemini.rs
          git commit -m 'fix: preserve Gemini 3 default temperature'
          git push origin HEAD:agent/quote-persistence-gemini
