# Caller: copy to <repo>/.github/workflows/images.yml. Builds Dockerfile.arm64.dkf + Dockerfile.x86-64.dkf
# (or Dockerfile) and pushes to GHCR, GCP Artifact Registry (<gcp-project> = this org's project) and the
# private Docker Hub namespace. Secrets are org-level: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT (OIDC, no JSON keys).
name: images
on:
  push:
    branches: [main]
    paths: ["Dockerfile", "Dockerfile.*.dkf", "src/**", "Cargo.*", "package*.json", "pubspec.*", "go.*", "gleam.toml", "manifest.toml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dkf-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with: { node-version: 22 }
      - name: Verify generated Dockerfile contracts
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/ORESoftware/ores-gha-workflows/f0725007da6d592ca912b8d3f841fb16d0a7513e/scripts/render-dkf.mjs -o /tmp/render-dkf.mjs
          node /tmp/render-dkf.mjs . --check
  images:
    needs: dkf-drift
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ORESoftware/ores-gha-workflows/.github/workflows/container-images.yml@f0725007da6d592ca912b8d3f841fb16d0a7513e
    with:
      image-name: canonical-cloud/canonical-api-fp.PqKW0h
      gcp-project: canonical-cloud
      dockerhub-namespace: oresoftware
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      BUILD_SECRET_GITHUB_TOKEN: ${{ secrets.SHARED_AUTH_READ_TOKEN }}
