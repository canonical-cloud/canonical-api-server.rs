name: source-format-witness

on:
  push:
    branches:
      - DEN-3938/opaque-persistence-boundaries
    paths:
      - "src/**/*.rs"
      - "tools/derive-persistence-lock.rs"
      - ".github/workflows/source-format-witness.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: DEN-3938/opaque-persistence-boundaries
          persist-credentials: true
          fetch-depth: 1

      - name: Install Rust 1.95.0 rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.95.0 --edition 2021 \
            src/readiness_observation_ingest.rs \
            src/rpc_routes/user/handlers.rs \
            tools/derive-persistence-lock.rs
          if git diff --quiet -- '*.rs'; then
            echo 'Rust sources already match the exact formatter witness.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/readiness_observation_ingest.rs \
            src/rpc_routes/user/handlers.rs \
            tools/derive-persistence-lock.rs
          git commit -m 'style: apply exact Rust 1.95 formatter witness'
          git push origin HEAD:DEN-3938/opaque-persistence-boundaries
