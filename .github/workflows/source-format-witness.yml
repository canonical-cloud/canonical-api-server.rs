name: source-format-witness

on:
  pull_request:
    paths:
      - "src/**/*.rs"
      - "tools/derive-persistence-lock.rs"
      - ".github/workflows/source-format-witness.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.95.0 rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format exact candidate workspace
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.95.0 --edition 2021 \
            src/main.rs \
            src/lib.rs \
            src/contract.rs \
            src/readiness.rs \
            src/readiness_observation_ingest.rs \
            src/rpc_routes/user/handlers.rs \
            src/telemetry.rs \
            tools/derive-persistence-lock.rs
          mkdir -p target/rustfmt-witness
          git diff --name-only -- '*.rs' | tee target/rustfmt-witness/changed-files.txt
          git diff --binary -- '*.rs' > target/rustfmt-witness/rustfmt.patch
          cp --parents \
            src/readiness_observation_ingest.rs \
            src/rpc_routes/user/handlers.rs \
            tools/derive-persistence-lock.rs \
            target/rustfmt-witness/

      - name: Upload exact formatted bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-format-witness-${{ github.run_id }}
          path: target/rustfmt-witness
          if-no-files-found: error
          retention-days: 3
