name: Publish Canonical quote v1 contract

on:
  push:
    branches: [agent/quote-v1-contract-20260808]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the dedicated agent branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Download the checksum-verified materialization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 31280192025 \
            --repo canonical-cloud/canonical-api-server.rs \
            --name canonical-quote-v1-materialized \
            --dir "$RUNNER_TEMP/materialized"
          cd "$RUNNER_TEMP/materialized"
          sed 's#  materialized/#  #' SHA256SUMS | sha256sum -c -

      - name: Publish validated source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/materialized/Cargo.toml" Cargo.toml
          cp "$RUNNER_TEMP/materialized/Cargo.lock" Cargo.lock
          cp "$RUNNER_TEMP/materialized/src/lib.rs" src/lib.rs
          cp "$RUNNER_TEMP/materialized/src/persistence.rs" src/persistence.rs
          cp "$RUNNER_TEMP/materialized/src/gemini.rs" src/gemini.rs
          cp "$RUNNER_TEMP/materialized/.github/workflows/ci.yml" .github/workflows/ci.yml
          rm -f \
            .github/workflows/materialize-quote-v1-contract.yml \
            patches/quote-v1-contract.patch \
            scripts/materialize-quote-v1-contract.py \
            scripts/materialize-quote-v1-test-fixtures.py
          rmdir patches 2>/dev/null || true
          git diff --check
          test "$(git hash-object fixtures/quote/v1/request.json)" = \
            fe8bf1ad08a7152d44ead22ee0d082842d28b208
          grep -F 'git+https://github.com/canonical-cloud/canonical-lib?rev=f0add30d4cc7e6825d24565e1db115751f833966#f0add30d4cc7e6825d24565e1db115751f833966' Cargo.lock
          grep -F 'git+https://github.com/canonical-cloud/canonical-interfaces?rev=4c6ca63ca24fa214a1cb1a917ac27f1d5265916a#4c6ca63ca24fa214a1cb1a917ac27f1d5265916a' Cargo.lock

      - name: Commit the exact validated bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canonical-contract-bot'
          git config user.email 'canonical-contract-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: converge API on canonical quote v1 contract'
          git push origin HEAD:agent/quote-v1-contract-20260808
