name: apply quote v1 contract once

on:
  push:
    branches:
      - den-2642/quote-v1-compatibility

permissions:
  contents: write

concurrency:
  group: apply-quote-v1-contract-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2642/quote-v1-compatibility
          persist-credentials: true
          show-progress: false
      - name: Install the repository-certified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0
      - name: Apply contract migration and extend the reviewed lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/apply_quote_v1_contract.py')
          source = path.read_text()
          source, count = re.subn(
              r'\nreplace\(\n    "src/lib\.rs",\n    \'            Self::InvalidGeminiModel.*?\n\)\n# The source uses',
              '\n# The source uses',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not remove obsolete ConfigError exact-match block')
          path.write_text(source)
          PY
          python3 scripts/apply_quote_v1_contract.py
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('src/lib.rs')
          source = lib.read_text()
          old = '#[derive(Clone, Debug, Deserialize, Serialize)]\npub struct CreateQuoteRequest {'
          new = '#[derive(Clone, Debug)]\npub struct CreateQuoteRequest {'
          if old not in source:
              raise SystemExit('normalized request derive block not found')
          source = source.replace(old, new, 1)
          source = source.replace('    #[serde(skip)]\n    pub(crate) wire:', '    pub(crate) wire:', 1)
          source = source.replace('    #[serde(skip_serializing)]\n    pub owner_subject:', '    pub owner_subject:', 1)
          lib.write_text(source)

          wire = Path('src/wire.rs')
          source = wire.read_text()
          old = '''    let mut request = CreateQuoteRequest {
'''
          if old not in source:
              raise SystemExit('wire request construction not found')
          source = source.replace(old, '    let request = CreateQuoteRequest {\n', 1)
          old = '''    request.validate_and_normalize()?;
    Ok(request)
'''
          if old not in source:
              raise SystemExit('wire request validation return not found')
          source = source.replace(old, '    request.validate_and_normalize()\n', 1)
          wire.write_text(source)
          PY
          # The existing lock already certifies SeaORM 2.0.1 and SQLx 0.9 on
          # Rust 1.95. This first unlocked run adds only the immutable interface
          # dependency and any feature-required entries, then all certification
          # runs use the resulting lock.
          cargo test --all-targets --all-features
          cargo fmt --all
          cargo test --all-targets --all-features --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Commit exact result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock .env.example src
          git commit -m 'feat(api): conform to canonical quote v1 interfaces'
          git push origin HEAD:den-2642/quote-v1-compatibility
