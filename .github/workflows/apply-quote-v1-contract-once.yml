name: apply quote v1 contract once

on:
  push:
    branches:
      - den-2642/quote-v1-compatibility

permissions:
  contents: write

concurrency:
  group: apply-quote-v1-contract-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2642/quote-v1-compatibility
          persist-credentials: true
          show-progress: false
      - name: Install Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.88.0
      - name: Apply contract migration and minimally extend the lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/apply_quote_v1_contract.py')
          source = path.read_text()
          source, count = re.subn(
              r'\nreplace\(\n    "src/lib\.rs",\n    \'            Self::InvalidGeminiModel.*?\n\)\n# The source uses',
              '\n# The source uses',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not remove obsolete ConfigError exact-match block')
          path.write_text(source)
          PY
          python3 scripts/apply_quote_v1_contract.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('Cargo.toml')
          source = path.read_text()
          source, count = re.subn(
              r'(?m)^(sea-orm\s*=\s*\{[^\n]*\bversion\s*=\s*)"2\.0\.0-rc\.4"',
              r'\1"=2.0.0-rc.4"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('expected reviewed SeaORM RC dependency not found exactly once')
          path.write_text(source)
          PY
          # Preserve the Rust 1.88-compatible SeaORM/SQLx graph while adding
          # the immutable interface package and chrono feature support.
          cargo test --all-targets
          cargo fmt --all
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Commit exact result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock .env.example src
          git commit -m 'feat(api): conform to canonical quote v1 interfaces'
          git push origin HEAD:den-2642/quote-v1-compatibility
