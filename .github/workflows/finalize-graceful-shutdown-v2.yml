name: Finalize graceful-shutdown rollout v2

on:
  push:
    branches:
      - agent/graceful-shutdown
    paths:
      - .github/workflows/finalize-graceful-shutdown-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-graceful-shutdown-cleanup
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out latest rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Validate final product source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Record the enforced lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/graceful-shutdown.md <<'EOF'
          # Graceful shutdown contract

          This server uses one coordinated lifecycle for HTTP connections, readiness, WebSocket connections, and background quote analysis.

          - SIGTERM and non-interactive SIGINT begin graceful drain with one signal.
          - In an interactive TTY, the first Ctrl-C begins drain; a second Ctrl-C forces shutdown.
          - After the first interactive Ctrl-C, Ctrl-D can be used instead of the second Ctrl-C.
          - Closed non-interactive stdin is ignored.
          - Readiness becomes unavailable before the listener stops accepting work; liveness remains available.
          - Existing HTTP and WebSocket connections drain until the configured deadline.
          - Quote-analysis jobs accepted before drain are tracked and awaited.
          - A second signal, Ctrl-D, or the deadline cancels remaining quote work and immediately closes active connections.
          - Structured lifecycle logs include the trigger, signal count, TTY state, phase, elapsed time, active connections, and outcome.

          Validation commands:

          ```text
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          ```
          EOF
          printf '\nValidated workflow source head: `%s`\n' "$GITHUB_SHA" >> docs/graceful-shutdown.md

      - name: Remove all branch-only migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/fix-graceful-shutdown.yml \
            .github/workflows/apply-lifecycle-migration.yml \
            .github/workflows/cleanup-graceful-shutdown.yml \
            .github/workflows/finalize-graceful-shutdown.yml \
            .github/workflows/finalize-graceful-shutdown-v2.yml \
            .github/graceful-shutdown/migration-v2.tgz.b64
          rmdir .github/graceful-shutdown 2>/dev/null || true
          git add docs/graceful-shutdown.md

      - name: Commit validated product and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record graceful-shutdown contract'
          git push origin "HEAD:${GITHUB_REF_NAME}"
