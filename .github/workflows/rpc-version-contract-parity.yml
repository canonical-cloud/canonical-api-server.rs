              "FindUsersResponse": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "FindUsersResponse",
                "type": "object",
                "properties": {
                  "result": {
                    "type": "object",
                    "properties": {
                      "users": {
                        "type": "array",
                        "maxItems": 100,
                        "items": {
                          "type": "object",
                          "properties": {
                            "id": { "type": "string" },
