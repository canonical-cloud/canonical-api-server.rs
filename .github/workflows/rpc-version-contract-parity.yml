          typespec: contracts/rpc-version/main.tsp
          schema: contracts/rpc-version/authored.schema.json
          generated_schema: .rpc-cross-evidence/sonus-admin/generated/typespec.generated.schema.json
          expected_declarations: '["SonusAurisAdminVersion.VersionError","SonusAurisAdminVersion.VersionResponse","SonusAurisAdminVersion.FindUsersHeaders","SonusAurisAdminVersion.FindUsersRequest","SonusAurisAdminVersion.FindUsersResponse","SonusAurisAdminVersion.FindUsersError"]'

      - name: Prepare canonical-admin exact authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'contracts/rpc/version/main.tsp')" .rpc-cross-evidence/canonical-admin/generated
          cat > 'contracts/rpc/version/main.tsp' <<'TSP_EOF'
          // Independently authored TypeSpec authority for Canonical admin RPC semantic payloads.
