            message: string;
          }
          
          @jsonSchema
          @extension("unevaluatedProperties", false)
          model FindUsersHeaders {
            @minLength(8)
            @maxLength(8199)
            authorization: string;
          }
          
          @jsonSchema
          @extension("unevaluatedProperties", false)
          model FindUsersRequest {
            @minLength(1)
            @maxLength(256)
            query: string;
            @minValue(1)
            @maxValue(100)
            limit: integer;
          }
          
          @jsonSchema
          @extension("unevaluatedProperties", false)
          model FindUsersResponse {
            result: {
              @maxItems(100)
              users: {
                id: string;
                user_name?: string;
                display_name?: string;
                active?: boolean;
              }[];
              @minValue(0)
              @maxValue(100)
              count: integer;
            };
            traceIds: string[];
          }
          
          @jsonSchema
          @extension("unevaluatedProperties", false)
          model FindUsersError {
            code: string;
            message: string;
          }
          
          TSP_EOF
          cat > 'contracts/rpc/version/authored.schema.json' <<'SCHEMA_EOF'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "urn:canonical-cloud:admin:rpc:v1",
            "$defs": {
              "VersionResponse": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
