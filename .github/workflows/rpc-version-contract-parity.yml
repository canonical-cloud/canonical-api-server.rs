name: Regular RPC product contract parity

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "contracts/rpc/version/**"
      - "src/rpc_routes/version/handlers.rs"
      - "src/rpc_routes/user/handlers.rs"
      - "generated/rpc/server-operation-index.json"
      - ".typespec-json-schema-validator/contract-ir.json"
      - ".typespec-json-schema-validator/report.json"
      - ".github/workflows/rpc-version-contract-parity.yml"
  push:
    branches: [main, dev]
    paths:
      - "Cargo.toml"
      - "contracts/rpc/version/**"
      - "src/rpc_routes/version/handlers.rs"
      - "src/rpc_routes/user/handlers.rs"
      - "generated/rpc/server-operation-index.json"
      - ".typespec-json-schema-validator/contract-ir.json"
      - ".typespec-json-schema-validator/report.json"
      - ".github/workflows/rpc-version-contract-parity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpc-regular-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust for lock regeneration
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Configure approved cross-repo GitHub dependency access
        shell: bash
        env:
          SYNC_FLEET_TOKEN: ${{ secrets.SYNC_FLEET_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${SYNC_FLEET_TOKEN:-}" ]]; then
            git config --global url."https://x-access-token:${SYNC_FLEET_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Regenerate Cargo.lock from Cargo.toml
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo generate-lockfile

      - name: Generate peer-authority receipt and Contract IR
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "128"

      - name: Require admitted regular RPC declarations
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalCloud.Rpc.Version.VersionResponse","CanonicalCloud.Rpc.Version.VersionError","CanonicalCloud.Rpc.Version.UserLookupHeaders","CanonicalCloud.Rpc.Version.FindUsersRequest","CanonicalCloud.Rpc.Version.FindUsersResponse","CanonicalCloud.Rpc.Version.FindUserByIdRequest","CanonicalCloud.Rpc.Version.FindUserByIdResponse","CanonicalCloud.Rpc.Version.UserLookupError"]'

      - name: Verify authored authorities were not modified
        shell: bash
        run: git diff --exit-code -- contracts/rpc/version/

      - name: Materialize reproducibility evidence on this PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock .typespec-json-schema-validator/report.json .typespec-json-schema-validator/contract-ir.json
          if git diff --cached --quiet; then
            echo "reproducibility evidence already current"
          else
            git config user.name "ores-stack-rpc-bot"
            git config user.email "ores-stack-rpc-bot@users.noreply.github.com"
            git commit -m "chore(rpc): materialize lock and contract evidence [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Require committed current evidence
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch .typespec-json-schema-validator/report.json
          git ls-files --error-unmatch .typespec-json-schema-validator/contract-ir.json
          test -s .typespec-json-schema-validator/report.json
          test -s .typespec-json-schema-validator/contract-ir.json
          git diff --exit-code -- \
            .typespec-json-schema-validator/report.json \
            .typespec-json-schema-validator/contract-ir.json

      - name: Retain diagnostic receipt and IR
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regular-rpc-contract-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
