name: Regular RPC product contract parity

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "contracts/rpc/version/**"
      - "src/rpc_routes/version/handlers.rs"
      - "src/rpc_routes/user/handlers.rs"
      - "generated/rpc/server-operation-index.json"
      - ".typespec-json-schema-validator/contract-ir.json"
      - ".typespec-json-schema-validator/report.json"
      - ".github/workflows/rpc-version-contract-parity.yml"
  push:
    branches: [main, dev]
    paths:
      - "Cargo.toml"
      - "contracts/rpc/version/**"
      - "src/rpc_routes/version/handlers.rs"
      - "src/rpc_routes/user/handlers.rs"
      - "generated/rpc/server-operation-index.json"
      - ".typespec-json-schema-validator/contract-ir.json"
      - ".typespec-json-schema-validator/report.json"
      - ".github/workflows/rpc-version-contract-parity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpc-regular-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Generate peer-authority receipt and Contract IR
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "128"

      - name: Require admitted regular RPC declarations
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: contracts/rpc/version/main.tsp
          schema: contracts/rpc/version/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["CanonicalCloud.Rpc.Version.VersionResponse","CanonicalCloud.Rpc.Version.VersionError","CanonicalCloud.Rpc.Version.UserLookupHeaders","CanonicalCloud.Rpc.Version.FindUsersRequest","CanonicalCloud.Rpc.Version.FindUsersResponse","CanonicalCloud.Rpc.Version.FindUserByIdRequest","CanonicalCloud.Rpc.Version.FindUserByIdResponse","CanonicalCloud.Rpc.Version.UserLookupError"]'

      - name: Verify authored authorities were not modified
        shell: bash
        run: git diff --exit-code -- contracts/rpc/version/

      - name: Install Rust for lock regeneration
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Regenerate Cargo.lock with scoped Canonical library read access
        shell: bash
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          if [[ -z "${CANONICAL_LIB_READ_TOKEN:-}" ]]; then
            echo "::error::CANONICAL_LIB_READ_TOKEN is required for the pinned private canonical-lib-core source" >&2
            exit 1
          fi
          credential_config="$RUNNER_TEMP/canonical-lib-read.gitconfig"
          cleanup() {
            rm -f "$credential_config"
          }
          trap cleanup EXIT
          umask 077
          cat >"$credential_config" <<EOF
          [url "https://x-access-token:${CANONICAL_LIB_READ_TOKEN}@github.com/"]
              insteadOf = https://github.com/
          EOF
          export GIT_CONFIG_GLOBAL="$credential_config"
          export GIT_CONFIG_NOSYSTEM=1
          cargo generate-lockfile

      - name: Materialize reproducibility evidence on this PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git add -f .typespec-json-schema-validator/report.json .typespec-json-schema-validator/contract-ir.json
          if git diff --cached --quiet; then
            echo "reproducibility evidence already current"
          else
            git config user.name "ores-stack-rpc-bot"
            git config user.email "ores-stack-rpc-bot@users.noreply.github.com"
            git commit -m "chore(rpc): materialize contract evidence"
            git push origin "HEAD:${{ github.head_ref }}"
          fi


      - name: Require committed current evidence
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch .typespec-json-schema-validator/report.json
          git ls-files --error-unmatch .typespec-json-schema-validator/contract-ir.json
          test -s .typespec-json-schema-validator/report.json
          test -s .typespec-json-schema-validator/contract-ir.json
          git diff --exit-code -- \
            .typespec-json-schema-validator/report.json \
            .typespec-json-schema-validator/contract-ir.json

      - name: Require Cargo.lock to be current
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock

      - name: Retain diagnostic receipt and IR
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regular-rpc-contract-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  cross-source-evidence:
    name: deterministic cross-source TJSV evidence
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact evidence-factory head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare sonus-regular exact authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'contracts/rpc-version/main.tsp')" .rpc-cross-evidence/sonus-regular/generated
          cat > 'contracts/rpc-version/main.tsp' <<'TSP_EOF'
          // Independently authored TypeSpec authority for regular Sonus RPC semantic payloads.
          // JSON Schema generated from this file is comparison evidence only.
          import "@typespec/json-schema";
          using TypeSpec.JsonSchema;
          
          namespace SonusAurisVersion;
          
          // Keep operation response structures inline: typed api-docs SDK generation
          // deliberately rejects JSON Schema $ref rather than degrading semantic payloads.
          @id("VersionResponse")
          model VersionResponse {
            result: {
              service: string;
              semver: string;
              calver: string;
              git_sha: string;
              @minValue(0)
              @maxValue(65535)
              protocol_min: integer;
              @minValue(0)
              @maxValue(65535)
              protocol_max: integer;
            };
            traceIds: string[];
          }
          
          @id("VersionError")
          model VersionError {
            code: string;
            message: string;
          }
          
          @id("UserLookupHeaders")
          model UserLookupHeaders {
            @minLength(8)
            @maxLength(8199)
            authorization: string;
          }
          
          @id("FindUsersRequest")
          model FindUsersRequest {
            @minLength(1)
            @maxLength(256)
            query: string;
            @minValue(1)
            @maxValue(100)
            limit: integer;
          }
          
          @id("FindUsersResponse")
          model FindUsersResponse {
            results: {
              id: string;
              user_name?: string;
              display_name?: string;
              active?: boolean;
            }[];
            traceIds: string[];
          }
          
          @id("FindUserByIdRequest")
          model FindUserByIdRequest {
            @minLength(1)
            @maxLength(256)
            user_id: string;
          }
          
          @id("FindUserByIdResponse")
          model FindUserByIdResponse {
            result: {
              id: string;
              user_name?: string;
              display_name?: string;
              active?: boolean;
            };
            traceIds: string[];
          }
          
          @id("UserLookupError")
          model UserLookupError {
            code: string;
            message: string;
          }
          
          TSP_EOF
          cat > 'contracts/rpc-version/authored.schema.json' <<'SCHEMA_EOF'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "sonus-auris.rpc-regular.schema.json",
            "$defs": {
              "VersionResponse": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "VersionResponse",
                "type": "object",
                "properties": {
                  "result": {
                    "type": "object",
                    "properties": {
                      "service": {
                        "type": "string"
                      },
                      "semver": {
                        "type": "string"
                      },
                      "calver": {
                        "type": "string"
                      },
                      "git_sha": {
                        "type": "string"
                      },
                      "protocol_min": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 65535
                      },
                      "protocol_max": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 65535
                      }
                    },
                    "required": [
                      "service",
                      "semver",
                      "calver",
                      "git_sha",
                      "protocol_min",
                      "protocol_max"
                    ],
                    "unevaluatedProperties": false
                  },
                  "traceIds": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  }
                },
                "required": [
                  "result",
                  "traceIds"
                ],
                "unevaluatedProperties": false
              },
              "VersionError": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "VersionError",
                "type": "object",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": [
                  "code",
                  "message"
                ],
                "unevaluatedProperties": false
              },
              "UserLookupHeaders": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "UserLookupHeaders",
                "type": "object",
                "properties": {
                  "authorization": {
                    "type": "string",
                    "minLength": 8,
                    "maxLength": 8199
                  }
                },
                "required": [
                  "authorization"
                ],
                "unevaluatedProperties": false
              },
              "FindUsersRequest": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "FindUsersRequest",
                "type": "object",
                "properties": {
                  "query": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "limit": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100
                  }
                },
                "required": [
                  "query",
                  "limit"
                ],
                "unevaluatedProperties": false
              },
              "FindUsersResponse": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "FindUsersResponse",
                "type": "object",
                "properties": {
                  "results": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "user_name": {
                          "type": "string"
                        },
                        "display_name": {
                          "type": "string"
                        },
                        "active": {
                          "type": "boolean"
                        }
                      },
                      "required": [
                        "id"
                      ],
                      "unevaluatedProperties": false
                    }
                  },
                  "traceIds": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  }
                },
                "required": [
                  "results",
                  "traceIds"
                ],
                "unevaluatedProperties": false
              },
              "FindUserByIdRequest": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "FindUserByIdRequest",
                "type": "object",
                "properties": {
                  "user_id": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  }
                },
                "required": [
                  "user_id"
                ],
                "unevaluatedProperties": false
              },
              "FindUserByIdResponse": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "FindUserByIdResponse",
                "type": "object",
                "properties": {
                  "result": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "string"
                      },
                      "user_name": {
                        "type": "string"
                      },
                      "display_name": {
                        "type": "string"
                      },
                      "active": {
                        "type": "boolean"
                      }
                    },
                    "required": [
                      "id"
                    ],
                    "unevaluatedProperties": false
                  },
                  "traceIds": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  }
                },
                "required": [
                  "result",
                  "traceIds"
                ],
                "unevaluatedProperties": false
              },
              "UserLookupError": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "UserLookupError",
                "type": "object",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": [
                  "code",
                  "message"
                ],
                "unevaluatedProperties": false
              }
            }
          }
          
          SCHEMA_EOF

      - name: Generate sonus-regular TJSV evidence
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/rpc-version/main.tsp
          schema: contracts/rpc-version/authored.schema.json
          report: .rpc-cross-evidence/sonus-regular/report.json
          sarif: ""
          contract_ir: .rpc-cross-evidence/sonus-regular/contract-ir.json
          output_dir: .rpc-cross-evidence/sonus-regular/generated
          max_probes: "128"

      - name: Admit sonus-regular exact declarations
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          contract_ir: .rpc-cross-evidence/sonus-regular/contract-ir.json
          report: .rpc-cross-evidence/sonus-regular/report.json
          typespec: contracts/rpc-version/main.tsp
          schema: contracts/rpc-version/authored.schema.json
          generated_schema: .rpc-cross-evidence/sonus-regular/generated/typespec.generated.schema.json
          expected_declarations: '["SonusAurisVersion.VersionError","SonusAurisVersion.VersionResponse","SonusAurisVersion.UserLookupHeaders","SonusAurisVersion.FindUsersResponse","SonusAurisVersion.FindUserByIdRequest","SonusAurisVersion.FindUserByIdResponse","SonusAurisVersion.UserLookupError"]'

      - name: Prepare sonus-admin exact authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'contracts/rpc-version/main.tsp')" .rpc-cross-evidence/sonus-admin/generated
          cat > 'contracts/rpc-version/main.tsp' <<'TSP_EOF'
          // Independently authored TypeSpec authority for Sonus admin RPC semantic payloads.
          // JSON Schema generated from this file is comparison evidence only.
          import "@typespec/json-schema";
          using TypeSpec.JsonSchema;
          
          namespace SonusAurisAdminVersion;
          
          // Keep operation response structures inline: typed api-docs SDK generation
          // deliberately rejects JSON Schema $ref rather than degrading semantic payloads.
          @id("VersionResponse")
          model VersionResponse {
            result: {
              status: string;
              service: string;
              revision: string;
            };
            traceIds: string[];
          }
          
          @id("VersionError")
          model VersionError {
            code: string;
            message: string;
          }
          
          @id("FindUsersHeaders")
          model FindUsersHeaders {
            @minLength(8)
            @maxLength(8199)
            authorization: string;
          }
          
          @id("FindUsersRequest")
          model FindUsersRequest {
            @minLength(1)
            @maxLength(256)
            query: string;
            @minValue(1)
            @maxValue(100)
            limit: integer;
          }
          
          @id("FindUsersResponse")
          model FindUsersResponse {
            result: {
              @maxItems(100)
              users: {
                id: string;
                user_name?: string;
                display_name?: string;
                active?: boolean;
              }[];
              @minValue(0)
              @maxValue(100)
              count: integer;
            };
            traceIds: string[];
          }
          
          @id("FindUsersError")
          model FindUsersError {
            code: string;
            message: string;
          }
          
          TSP_EOF
          cat > 'contracts/rpc-version/authored.schema.json' <<'SCHEMA_EOF'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "sonus-auris.admin.rpc.schema.json",
            "$defs": {
              "VersionResponse": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
