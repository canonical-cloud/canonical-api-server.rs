name: Sync graceful-shutdown generated artifacts

on:
  push:
    branches:
      - agent/graceful-shutdown
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/sync-graceful-shutdown.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-api-server-graceful-shutdown-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format, resolve, and compile every target
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --no-run --all-targets

      - name: Commit only generated or formatted Rust artifacts
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Rust artifacts are already current.'
            exit 0
          fi

          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(Cargo\.lock|src/.*\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Refusing to commit unexpected files:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src
          git commit -m 'chore: sync graceful-shutdown artifacts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
