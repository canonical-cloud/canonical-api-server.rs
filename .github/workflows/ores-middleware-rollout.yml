permissions:
  contents: write

jobs:
  rollout:
    uses: ORESoftware/ores-middleware/.github/workflows/rust-server-rollout.yml@b6a5e72bc05c15a8a673fc1a27987154f2b460c8
    with:
      source: src/main.rs
