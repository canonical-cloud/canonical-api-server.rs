name: ores-middleware-rollout

on:
  push:
    branches: [feat/ores-rate-limit-audit-v2]

permissions:
  contents: write

jobs:
  rollout:
    uses: ORESoftware/ores-middleware/.github/workflows/rust-server-rollout.yml@ec2327b079b88ac8fe21c3a331fe414735e2e716
    with:
      source: src/main.rs
      manifest: Cargo.toml
      middleware_revision: ec2327b079b88ac8fe21c3a331fe414735e2e716
      call_name: shutdown::serve
      router_argument: 1
      error_mode: question
      rate_limit_mode: audit
    secrets: inherit
