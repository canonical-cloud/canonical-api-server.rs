name: apply owner active context

on:
  push:
    branches:
      - agent/owner-active-context

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/owner-active-context

      - name: Apply owner-selected context contract
        run: python3 .bootstrap/apply_owner_active_context.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Format and verify
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 test --all-targets --all-features --locked
          cargo +1.95.0 clippy --all-targets --all-features --locked -- -D warnings

      - name: Commit verified source-only implementation
        run: |
          set -euo pipefail
          git config user.name 'canonical-implementation-bot'
          git config user.email 'canonical-implementation-bot@users.noreply.github.com'
          git add src/lib.rs src/gemini.rs src/persistence.rs db/schema.sql README.md docs/persistence-contract.md
          git commit -m 'fix: select active context by authenticated owner'
          git push origin HEAD:agent/owner-active-context
