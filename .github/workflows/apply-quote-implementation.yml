name: apply-quote-implementation

on:
  push:
    branches:
      - agent/quote-persistence-gemini

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/quote-persistence-gemini

      - name: Apply reviewed implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/quote-api-payload-*.b64 | base64 --decode > /tmp/canonical-quote-api.tar.gz
          tar --extract --gzip --file /tmp/canonical-quote-api.tar.gz

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format source and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 generate-lockfile

      - name: Commit implementation and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canonical-implementation-bot'
          git config user.email 'canonical-implementation-bot@users.noreply.github.com'
          git rm --recursive .bootstrap
          git rm .github/workflows/apply-quote-implementation.yml
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: persist and analyze compliance quotes'
          git push origin HEAD:agent/quote-persistence-gemini
