name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-api-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package, container, model, and security contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('.zpkg.toml').read_text())
          assert manifest['package']['name'] == 'canonical-api-server'
          assert set(manifest['dependencies']) == {
              'canonical-cloud/canonical-interfaces',
              'canonical-cloud/canonical-lib',
          }
          assert Path('.zpkg.lock').read_text() == 'version = 1\n'

          dockerfile = Path('Dockerfile').read_text()
          assert 'FROM gcr.io/distroless/cc-debian12:nonroot' in dockerfile
          assert 'COPY --from=builder --chown=65532:65532' in dockerfile
          assert '/target/release/canonical-api-server' in dockerfile
          assert 'USER 65532:65532' in dockerfile
          assert 'cargo build --locked --release --bin canonical-api-server' in dockerfile
          assert Path('.dockerignore').is_file()

          source = '\n'.join(
              path.read_text()
              for path in sorted(Path('src').glob('*.rs'))
          )
          for required in (
              'CANONICAL_WEB_SERVICE_TOKEN',
              'DATABASE_URL',
              'MIGRATION_DATABASE_URL',
              'GEMINI_API_KEY',
              'GEMINI_MODEL',
          ):
              assert required in source, required
          assert 'const DEFAULT_GEMINI_MODEL: &str = "gemini-3.6-pro";' in source
          assert 'GEMINI_MODEL=gemini-3.6-pro' in Path('.env.example').read_text()
          PY

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: canonical-api-server-ubuntu-24.04-rust-1.95

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings denied
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets --all-features --locked

  container:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect the distroless image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag canonical-api-server:ci .
          test "$(docker image inspect canonical-api-server:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect canonical-api-server:ci --format '{{json .Config.Entrypoint}}')" = '["/app/canonical-api-server","serve"]'
          test "$(docker image inspect canonical-api-server:ci --format '{{json .Config.ExposedPorts}}')" = '{"8080/tcp":{}}'

      - name: Prove the packaged executable starts without loading deployment secrets
        shell: bash
        run: |
          set +e
          output="$(docker run --rm --entrypoint /app/canonical-api-server canonical-api-server:ci invalid 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'unknown command "invalid"; expected serve or migrate' <<<"$output"
