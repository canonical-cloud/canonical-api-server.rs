name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-api-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Validate repository, interface, database, and Gemini contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-ci-contract.py
          python3 scripts/verify-declarative-db-contract.py

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build the production container image
        run: docker build --tag canonical-api-server:ci .

      - name: Smoke-test the container health route
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --detach \
            --name canonical-api-server-ci \
            --publish 18080:8080 \
            --env CANONICAL_INTERNAL_AUTH_TOKEN=0123456789abcdef0123456789abcdef \
            canonical-api-server:ci
          trap 'docker logs canonical-api-server-ci || true; docker rm --force canonical-api-server-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >health.json; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json

          health = json.load(open('health.json'))
          assert health['status'] == 'ok'
          assert health['service'] == 'canonical-api-server'
          assert health['databaseConfigured'] is False
          assert health['geminiConfigured'] is False
          assert health['geminiModel'] == 'gemini-3.6-flash'
          PY
