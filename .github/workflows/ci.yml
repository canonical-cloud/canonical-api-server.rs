name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-api-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Require committed RPC lockfile parity before network access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          dependencies = manifest.get("dependencies", {})
          locked = lock.get("package", [])

          dependency_names = (
              "ores-api-docs",
              "ores-api-docs-operation-macros",
          )
          errors = []
          for dependency_name in dependency_names:
              dependency = dependencies.get(dependency_name)
              if not isinstance(dependency, dict):
                  errors.append(f"Cargo.toml is missing table dependency {dependency_name}")
                  continue
              git = dependency.get("git")
              rev = dependency.get("rev")
              package = dependency.get("package", dependency_name)
              if git != "https://github.com/ORESoftware/api-docs.git":
                  errors.append(
                      f"{dependency_name} must come from https://github.com/ORESoftware/api-docs.git, got {git!r}"
                  )
                  continue
              if not isinstance(rev, str) or len(rev) != 40:
                  errors.append(f"{dependency_name} must pin a full 40-character git rev")
                  continue

              matches = [entry for entry in locked if entry.get("name") == package]
              if len(matches) != 1:
                  errors.append(
                      f"Cargo.lock must contain exactly one {package} package entry; found {len(matches)}"
                  )
                  continue
              source = matches[0].get("source", "")
              expected_prefix = f"git+{git}?rev={rev}#{rev}"
              if source != expected_prefix:
                  errors.append(
                      f"Cargo.lock {package} source does not match Cargo.toml rev {rev}: {source!r}"
                  )

          if errors:
              for error in errors:
                  print(f"::error::{error}", file=sys.stderr)
              raise SystemExit(1)
          PY
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Fetch locked private dependencies with least privilege
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.CANONICAL_LIB_READ_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CANONICAL_LIB_READ_TOKEN" ]; then
            echo "CANONICAL_LIB_READ_TOKEN must grant read-only access to canonical-lib-core" >&2
            exit 1
          fi
          cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint from the fetched dependency graph
        run: cargo clippy --locked --offline --all-targets --all-features -- -D warnings

      - name: Run tests from the fetched dependency graph
        run: cargo test --locked --offline --all-targets --all-features

      - name: Validate repository, dependency, database, and Gemini contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-ci-contract.py
          python3 scripts/verify-declarative-db-contract.py
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          dependencies = manifest["dependencies"]
          assert dependencies["shared-auth-client"]["rev"] == "cc57a85b276bee81ad94decc87df2f48d49cab9f"
          assert dependencies["next-loggers"]["rev"] == "ca176fb6768a9750d262a536952268625ffd3a8a"
          assert dependencies["canonical-lib"]["git"].endswith("/canonical-lib-core")
          PY

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate a masked disposable internal credential
        id: smoke_token
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Require private Canonical library read credential
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
        run: |
          if [ -z "$CANONICAL_LIB_READ_TOKEN" ]; then
            echo "CANONICAL_LIB_READ_TOKEN must grant read-only access to canonical-lib-core" >&2
            exit 1
          fi

      - name: Build the production container image
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
        run: >-
          docker build
          --secret id=canonical_lib_read_token,env=CANONICAL_LIB_READ_TOKEN
          --tag canonical-api-server:ci
          .

      - name: Smoke-test the container health route
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --detach \
            --name canonical-api-server-ci \
            --publish 18080:8080 \
            --env CANONICAL_INTERNAL_AUTH_TOKEN=${{ steps.smoke_token.outputs.value }} \
            canonical-api-server:ci
          trap 'docker logs canonical-api-server-ci || true; docker rm --force canonical-api-server-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >health.json; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json

          health = json.load(open('health.json'))
          assert health['status'] == 'ok'
          assert health['service'] == 'canonical-api-server'
          assert health['databaseConfigured'] is False
          assert health['geminiConfigured'] is False
          assert health['geminiModel'] == 'gemini-3.6-flash'
          PY
