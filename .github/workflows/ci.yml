name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-api-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Require committed RPC lockfile parity before network access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          deps = manifest["dependencies"]
          runtime = deps["ores-api-docs"]
          macros = deps["ores-api-docs-operation-macros"]

          for name, dep in [
              ("ores-api-docs", runtime),
              ("ores-api-docs-operation-macros", macros),
          ]:
              if dep.get("git") != "https://github.com/ORESoftware/api-docs.git":
                  raise SystemExit(f"{name} must come from the reviewed ORESoftware/api-docs repository")
              rev = dep.get("rev", "")
              if len(rev) != 40 or any(ch not in "0123456789abcdef" for ch in rev):
                  raise SystemExit(f"{name} must be pinned to an exact lowercase 40-hex revision")

          if runtime["rev"] != macros["rev"]:
              raise SystemExit(
                  "ores-api-docs and ores-api-docs-operation-macros must use one exact source revision"
              )

          lock = pathlib.Path("Cargo.lock").read_text()
          for package in ["ores-api-docs", "ores-api-docs-operation-macros"]:
              if f'name = "{package}"' not in lock:
                  raise SystemExit(f"Cargo.lock does not contain {package}; regenerate it after changing Cargo.toml")
          if runtime["rev"] not in lock:
              raise SystemExit(
                  f"Cargo.lock is not pinned to the api-docs revision declared by Cargo.toml: {runtime['rev']}"
              )
          PY
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      # rustfmt itself needs no dependency checkout. The repository currently
      # has two unrelated base-tree formatting findings, so check the Rust file
      # this PR actually changes before private credentials are required. The
      # full workspace format gate remains below after the locked graph is
      # available; this early check is additive, not a waiver.
      - name: Check touched Rust formatting before private dependency access
        run: rustfmt --edition 2021 --check src/telemetry.rs

      - name: Fetch locked private dependencies with least privilege
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.CANONICAL_LIB_READ_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CANONICAL_LIB_READ_TOKEN" ]; then
            echo "CANONICAL_LIB_READ_TOKEN must grant read-only access to canonical-lib-core" >&2
            exit 1
          fi
          cargo fetch --locked

      - name: Check full workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint from the fetched dependency graph
        run: cargo clippy --locked --offline --all-targets --all-features -- -D warnings

      - name: Run tests from the fetched dependency graph
        run: cargo test --locked --offline --all-targets --all-features

      - name: Validate repository, dependency, database, and Gemini contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-ci-contract.py
          python3 scripts/verify-declarative-db-contract.py
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          dependencies = manifest["dependencies"]
          assert dependencies["shared-auth-client"]["rev"] == "cc57a85b276bee81ad94decc87df2f48d49cab9f"
          assert dependencies["next-loggers"]["rev"] == "ca176fb6768a9750d262a536952268625ffd3a8a"
          assert dependencies["canonical-lib"]["git"].endswith("/canonical-lib-core")
          PY

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate a masked disposable internal credential
        id: smoke_token
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Require private Canonical library read credential
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
        run: |
          if [ -z "$CANONICAL_LIB_READ_TOKEN" ]; then
            echo "CANONICAL_LIB_READ_TOKEN must grant read-only access to canonical-lib-core" >&2
            exit 1
          fi

      - name: Build the production container image
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
        run: >-
          docker build
          --secret id=canonical_lib_read_token,env=CANONICAL_LIB_READ_TOKEN
          --tag canonical-api-server:ci
          .

      - name: Smoke-test the container health route
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --detach \
            --name canonical-api-server-ci \
            --publish 18080:8080 \
            --env CANONICAL_INTERNAL_AUTH_TOKEN=${{ steps.smoke_token.outputs.value }} \
            canonical-api-server:ci
          trap 'docker logs canonical-api-server-ci || true; docker rm --force canonical-api-server-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >health.json; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json

          health = json.load(open('health.json'))
          assert health['status'] == 'ok'
          assert health['service'] == 'canonical-api-server'
          assert health['databaseConfigured'] is False
          assert health['geminiConfigured'] is False
          assert health['geminiModel'] == 'gemini-3.6-flash'
          PY
