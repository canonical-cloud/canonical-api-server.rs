name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-api-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Validate repository, interface, database, and Gemini contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          schema = (root / 'db/schema.sql').read_text()
          bootstrap = (root / 'db/bootstrap.sql').read_text()
          grants = (root / 'db/grants.sql').read_text()
          persistence = (root / 'src/persistence.rs').read_text()
          library = (root / 'src/lib.rs').read_text()
          gemini = (root / 'src/gemini.rs').read_text()
          cargo = (root / 'Cargo.toml').read_text()
          cargo_lock = (root / 'Cargo.lock').read_text()
          env_example = (root / '.env.example').read_text()
          zpkg = (root / '.zpkg.toml').read_text()
          declarative_workflow = (root / '.github/workflows/declarative-postgres.yml').read_text()
          cargo_toml = tomllib.loads(cargo)
          zpkg_toml = tomllib.loads(zpkg)
          interface_lock = json.loads((root / 'interfaces.lock.json').read_text())
          namespace = json.loads((root / 'db/namespace.json').read_text())
          fixture = json.loads((root / 'fixtures/quote/v1/request.json').read_text())

          dpm_revision = 'd05a7880987ddaa271fa88b52c787390ef12b899'
          canonical_lib_revision = 'f0add30d4cc7e6825d24565e1db115751f833966'
          canonical_interfaces_revision = '4c6ca63ca24fa214a1cb1a917ac27f1d5265916a'
          fixture_blob = 'fe8bf1ad08a7152d44ead22ee0d082842d28b208'

          assert namespace['namespaceId'] == 'canonical_cloud__quote'
          assert namespace['database']['schema'] == 'canonical_cloud__quote'
          assert namespace['database']['minimumMajorVersion'] == 17
          assert namespace['declarativeMigration']['revision'] == dpm_revision
          assert namespace['declarativeMigration']['source'] == 'db/schema.sql'
          assert namespace['declarativeMigration']['sourceSha256'] == hashlib.sha256(schema.encode()).hexdigest()
          assert namespace['roles'] == {
              'migrator': 'canonical_cloud__quote__migrator',
              'apiRuntime': 'canonical_cloud__quote__api_rw',
              'webRuntime': 'canonical_cloud__quote__web_ro',
          }
          assert namespace['readiness'] == {
              'endpoint': '/readyz',
              'runtimeRole': 'canonical_cloud__quote__api_rw',
              'livenessEndpoint': '/healthz',
              'failClosed': True,
          }

          assert interface_lock['schema_version'] == 1
          assert interface_lock['canonical_lib']['repository'] == 'canonical-cloud/canonical-lib'
          assert interface_lock['canonical_lib']['commit'] == canonical_lib_revision
          assert interface_lock['canonical_interfaces']['repository'] == 'canonical-cloud/canonical-interfaces'
          assert interface_lock['canonical_interfaces']['commit'] == canonical_interfaces_revision
          assert interface_lock['canonical_interfaces']['quote_request_fixture']['path'] == 'fixtures/quote/v1/request.json'
          assert interface_lock['canonical_interfaces']['quote_request_fixture']['git_blob'] == fixture_blob
          assert 'canonical-lib' in cargo_lock
          assert f'source = "git+https://github.com/canonical-cloud/canonical-lib?rev={canonical_lib_revision}#{canonical_lib_revision}"' in cargo_lock
          canonical_lib_dependency = cargo_toml['dependencies']['canonical-lib']
          assert canonical_lib_dependency == {
              'version': '=0.1.0',
              'git': 'https://github.com/canonical-cloud/canonical-lib',
              'rev': canonical_lib_revision,
          }
          assert zpkg_toml['package']['name'] == 'canonical-api-server'
          assert zpkg_toml['package']['repository']['url'] == 'https://github.com/canonical-cloud/canonical-api-server.rs'
          assert zpkg_toml['dependencies']['canonical-cloud/canonical-lib'] == '^0.1.0'
          assert zpkg_toml['dependencies']['canonical-cloud/canonical-interfaces'] == '^0.1.0'
          assert 'repository: declarative-migrations/declarative-postgres-migrate.rs' in declarative_workflow
          assert f'ref: {dpm_revision}' in declarative_workflow
          assert fixture['organizationName'] == 'Example Company'
          assert fixture['contactEmail'] == 'security@example.com'
          assert fixture['frameworks'] == [
              'soc2_type_2',
              'nist_csf_2',
              'nist_800_53',
              'hipaa',
          ]
          assert fixture['answersVersion'] == 1
          assert 'include_str!("../fixtures/quote/v1/request.json")' in library
          assert '/api/v1/quotes' in library
          assert 'DEFAULT_GEMINI_MODEL: &str = "gemini-3.6-flash"' in library
          assert 'gemini-3.6-pro' not in library
          assert 'GEMINI_MODEL=gemini-3.6-flash' in env_example
          assert 'gemini-3.6-pro' not in env_example
          assert '"thinkingLevel": "high"' in gemini
          assert '"responseFormat"' in gemini
          assert 'analysis_schema()' in gemini
          assert 'thinkingBudget' not in gemini
          assert 'responseMimeType' not in gemini
          assert 'responseJsonSchema' not in gemini
          assert "set_config('app.current_subject', $1, true)" in persistence
          assert "DATABASE_URL is not configured; quote persistence remains memory-only" in persistence

          for forbidden in ('IF NOT EXISTS', 'BEGIN;', 'COMMIT;', 'GRANT ', 'REVOKE '):
              assert forbidden not in schema, forbidden
          assert schema.count('CREATE SCHEMA canonical_cloud__quote;') == 1

          table_names = (
              'canonical_context',
              'canonical_quote',
              'canonical_quote_event',
              'canonical_model_attempt',
          )
          for table in table_names:
              assert f'CREATE TABLE canonical_cloud__quote.{table}' in schema
              assert f'ALTER TABLE canonical_cloud__quote.{table}\n    FORCE ROW LEVEL SECURITY' in schema
              assert table in persistence

          for constraint in (
              'canonical_context_json_object_check',
              'canonical_context_id_owner_unique',
              'canonical_quote_request_json_object_check',
              'canonical_quote_context_snapshot_json_object_check',
              'canonical_quote_analysis_json_object_check',
              'canonical_quote_id_owner_unique',
              'canonical_quote_context_owner_fk',
              'canonical_quote_event_details_json_object_check',
              'canonical_quote_event_quote_owner_fk',
              'canonical_model_attempt_status_finished_check',
              'canonical_model_attempt_time_order_check',
              'canonical_model_attempt_quote_owner_fk',
          ):
              assert schema.count(f'CONSTRAINT {constraint}') == 1, constraint

          for policy in (
              'canonical_context_owner_policy',
              'canonical_quote_owner_policy',
              'canonical_quote_event_owner_policy',
              'canonical_model_attempt_owner_policy',
          ):
              assert schema.count(f'CREATE POLICY {policy}') == 1, policy

          for role in (
              'canonical_cloud__quote__migrator',
              'canonical_cloud__quote__api_rw',
              'canonical_cloud__quote__web_ro',
          ):
              assert role in bootstrap
          assert 'NOT rolcanlogin' in bootstrap
          assert 'rolinherit' in bootstrap
          assert 'pg_has_role(' in bootstrap
          assert 'canonical_quote_event API privilege contract is not append-only' in grants
          assert 'has_sequence_privilege' in grants
          assert 'has_function_privilege' in grants
          assert 'GRANT ALL' not in grants
          PY
          test "$(git ls-files --error-unmatch interfaces.lock.json)" = "interfaces.lock.json"
          test "$(git ls-files --error-unmatch fixtures/quote/v1/request.json)" = "fixtures/quote/v1/request.json"
          test "$(git ls-files --error-unmatch db/namespace.json)" = "db/namespace.json"
          test "$(git ls-files --error-unmatch .github/workflows/declarative-postgres.yml)" = \
            ".github/workflows/declarative-postgres.yml"
          python3 scripts/verify-declarative-db-contract.py

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build the production container image
        run: docker build --tag canonical-api-server:ci .

      - name: Smoke-test the container health route
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --detach \
            --name canonical-api-server-ci \
            --publish 18080:8080 \
            --env CANONICAL_INTERNAL_AUTH_TOKEN=0123456789abcdef0123456789abcdef \
            canonical-api-server:ci
          trap 'docker logs canonical-api-server-ci || true; docker rm --force canonical-api-server-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >health.json; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json

          health = json.load(open('health.json'))
          assert health['status'] == 'ok'
          assert health['service'] == 'canonical-api-server'
          assert health['databaseConfigured'] is False
          assert health['geminiConfigured'] is False
          assert health['geminiModel'] == 'gemini-3.6-flash'
          PY
