name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-api-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package, container, model, and security contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('.zpkg.toml').read_text())
          assert manifest['package']['name'] == 'canonical-api-server'
          assert set(manifest['dependencies']) == {
              'canonical-cloud/canonical-interfaces',
              'canonical-cloud/canonical-lib',
          }
          assert Path('.zpkg.lock').read_text() == 'version = 1\n'

          interface_lock = json.loads(Path('interfaces.lock.json').read_text())
          assert interface_lock['schema_version'] == 1
          assert interface_lock['canonical_lib']['commit'] == \
              'f0add30d4cc7e6825d24565e1db115751f833966'
          assert interface_lock['canonical_interfaces']['commit'] == \
              '4c6ca63ca24fa214a1cb1a917ac27f1d5265916a'
          fixture = Path('fixtures/quote/v1/request.json')
          expected_blob = interface_lock['canonical_interfaces'][\
              'quote_request_fixture']['git_blob']
          actual_blob = subprocess.check_output(
              ['git', 'hash-object', str(fixture)], text=True
          ).strip()
          assert actual_blob == expected_blob == \
              'fe8bf1ad08a7152d44ead22ee0d082842d28b208'

          cargo = Path('Cargo.toml').read_text()
          assert 'canonical-lib' in cargo
          assert 'f0add30d4cc7e6825d24565e1db115751f833966' in cargo

          dockerfile = Path('Dockerfile').read_text()
          assert 'FROM gcr.io/distroless/cc-debian12:nonroot' in dockerfile
          assert 'COPY --from=builder --chown=65532:65532' in dockerfile
          assert '/target/release/canonical-api-server' in dockerfile
          assert 'USER 65532:65532' in dockerfile
          assert 'cargo build --locked --release --bin canonical-api-server' in dockerfile
          assert 'ENTRYPOINT ["/app/canonical-api-server"]' in dockerfile
          assert Path('.dockerignore').is_file()
          assert Path('.github/workflows/release.yml').is_file()

          source = '\n'.join(
              path.read_text()
              for path in sorted(Path('src').glob('*.rs'))
          )
          for required in (
              'CANONICAL_INTERNAL_AUTH_TOKEN',
              'DATABASE_URL',
              'GEMINI_API_KEY',
              'GEMINI_MODEL',
              'x-canonical-internal-token',
              'x-canonical-subject',
              'x-goog-api-key',
          ):
              assert required in source, required

          assert 'pub const DEFAULT_GEMINI_MODEL: &str = "gemini-3.6-pro";' in source
          assert 'gemini-3.1-pro-preview' not in source
          env_example = Path('.env.example').read_text()
          assert 'GEMINI_MODEL=gemini-3.6-pro' in env_example
          assert 'CANONICAL_INTERNAL_AUTH_TOKEN=' in env_example
          assert 'gemini-3.1-pro-preview' not in env_example

          gemini = Path('src/gemini.rs').read_text()
          assert '.redirect(Policy::none())' in gemini
          assert 'generativelanguage.googleapis.com' in gemini
          assert '"responseFormat"' in gemini
          assert '"mimeType": "application/json"' in gemini
          assert '"schema": analysis_schema()' in gemini
          assert '"temperature": 0.2' not in gemini

          schema = Path('db/schema.sql').read_text()
          assert 'ALTER TABLE canonical_quote FORCE ROW LEVEL SECURITY' in schema
          assert 'ALTER TABLE canonical_context FORCE ROW LEVEL SECURITY' in schema
          assert 'canonical_context_one_active_per_owner_idx' in schema
          assert 'WHERE active = TRUE' in schema
          assert 'canonical_quote_event' in schema
          assert 'canonical_model_attempt' in schema

          persistence = Path('src/persistence.rs').read_text()
          assert 'WHERE owner_subject = $1' in persistence
          assert 'request.context_record_id' not in persistence
          assert 'ORDER BY updated_at DESC, id' in persistence
          PY

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: canonical-api-server-ubuntu-24.04-rust-1.95

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings denied
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets --all-features --locked

  container:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect the distroless image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag canonical-api-server:ci .
          test "$(docker image inspect canonical-api-server:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect canonical-api-server:ci --format '{{json .Config.Entrypoint}}')" = '["/app/canonical-api-server"]'
          test "$(docker image inspect canonical-api-server:ci --format '{{json .Config.ExposedPorts}}')" = '{"8080/tcp":{}}'

      - name: Smoke-test the packaged health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_name=canonical-api-server-ci-runtime
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --env CANONICAL_INTERNAL_AUTH_TOKEN=ci-only-random-token-with-at-least-32-bytes \
            --publish 127.0.0.1:18080:8080 \
            canonical-api-server:ci >/dev/null

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz > health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz > health.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('health.json').read_text())
          assert health['service'] == 'canonical-api-server'
          assert health['status'] == 'ok'
          assert health['databaseConfigured'] is False
          assert health['geminiConfigured'] is False
          assert health['geminiModel'] == 'gemini-3.6-pro'
          PY
