name: canonical interface dependency contract

on:
  pull_request:
    paths:
      - ".zpkg.toml"
      - ".zpkg/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "interfaces-source.lock.json"
      - "scripts/verify_interface_contract.py"
      - "src/main.rs"
      - "src/contract.rs"
      - ".github/workflows/interface-contract.yml"
  push:
    branches: [main]
    paths:
      - ".zpkg.toml"
      - ".zpkg/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "interfaces-source.lock.json"
      - "scripts/verify_interface_contract.py"
      - "src/main.rs"
      - "src/contract.rs"
      - ".github/workflows/interface-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Verify Zed, Cargo, lock, and source parity
        run: python3 scripts/verify_interface_contract.py
      - name: Run the Zed pre-build contract
        run: sh ./.zpkg/pre-build
      - name: Prove the API contract and generated request type compile together
        run: cargo test --all-targets --all-features --locked contract
      - name: Lint the direct interface integration
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
