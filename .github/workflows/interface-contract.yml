name: canonical interface dependency contract

on:
  pull_request:
    paths:
      - ".zpkg.toml"
      - ".zpkg/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "interfaces-source.lock.json"
      - "scripts/verify_interface_contract.py"
      - "src/main.rs"
      - "src/contract.rs"
      - ".github/workflows/interface-contract.yml"
  push:
    branches: [main]
    paths:
      - ".zpkg.toml"
      - ".zpkg/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "interfaces-source.lock.json"
      - "scripts/verify_interface_contract.py"
      - "src/main.rs"
      - "src/contract.rs"
      - ".github/workflows/interface-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Verify Zed, Cargo, lock, and source parity
        run: python3 scripts/verify_interface_contract.py

      - name: Fetch locked private dependencies with least privilege
        env:
          CANONICAL_LIB_READ_TOKEN: ${{ secrets.CANONICAL_LIB_READ_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.CANONICAL_LIB_READ_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CANONICAL_LIB_READ_TOKEN" ]; then
            echo "CANONICAL_LIB_READ_TOKEN must grant read-only access to Canonical private Rust dependencies" >&2
            exit 1
          fi
          cargo fetch --locked

      - name: Run the Zed pre-build contract from the fetched graph
        env:
          CARGO_NET_OFFLINE: "true"
        run: sh ./.zpkg/pre-build
      - name: Prove the API contract and generated request type compile together
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --offline --all-targets --all-features --locked contract
      - name: Lint the direct interface integration
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --offline --all-targets --all-features --locked -- -D warnings
